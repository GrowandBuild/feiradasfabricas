<!DOCTYPE html>
<html>
<head>
    <title>Teste Ctrl+V</title>
    <style>
        .paste-zone {
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin: 20px;
            cursor: pointer;
            background: #f8f9fa;
        }
        .paste-zone.paste-success {
            border-color: #10b981;
            background: #f0fdf4;
        }
        #images-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px;
        }
        .image-preview {
            width: 100px;
            height: 100px;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
        }
        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <h1>Teste de Ctrl+V para Imagens</h1>
    
    <div class="paste-zone" id="createProductPasteZone">
        <div class="paste-content">
            <i style="font-size: 2rem; color: #6c757d;">📋</i>
            <p>Cole uma imagem com Ctrl+V ou clique para selecionar</p>
            <small>Teste de funcionalidade</small>
        </div>
        <input type="file" id="images" multiple accept="image/*" style="display: none;">
    </div>
    
    <div id="images-container"></div>
    
    <div style="margin: 20px;">
        <input type="text" placeholder="Teste colando imagem com foco aqui" style="width: 300px; padding: 10px;">
    </div>

    <script>
        // Validação de imagem
        function validateImageFile(file) {
            const maxSize = 10 * 1024 * 1024; // 10MB
            const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/gif', 'image/webp', 'image/avif'];
            
            if (!allowedTypes.includes(file.type) && !file.name.toLowerCase().endsWith('.avif')) {
                console.error('Formato de arquivo não permitido. Use: JPG, PNG, GIF, WEBP ou AVIF');
                return false;
            }
            
            if (file.size > maxSize) {
                console.error('Arquivo muito grande. Tamanho máximo: 10MB');
                return false;
            }
            
            return true;
        }

        // Preview de imagens
        function handleImageFiles(files) {
            const container = document.getElementById('images-container');
            
            Array.from(files).forEach(file => {
                if (validateImageFile(file)) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const div = document.createElement('div');
                        div.className = 'image-preview';
                        div.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                        container.appendChild(div);
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

        // Click para abrir file dialog
        document.getElementById('createProductPasteZone').addEventListener('click', function() {
            document.getElementById('images').click();
        });

        // File input change
        document.getElementById('images').addEventListener('change', function(e) {
            handleImageFiles(e.target.files);
        });

        // Ctrl+V GLOBAL - CORRIGIDO
        document.addEventListener('paste', function(e) {
            console.log('Paste event detected');
            
            const items = Array.from(e.clipboardData.items);
            const imageItems = items.filter(item => 
                item.type.indexOf('image') !== -1 || item.type === 'text/uri-list'
            );
            
            console.log('Image items found:', imageItems.length);
            
            if (imageItems.length === 0) return;
            
            // Só previne o comportamento padrão se encontrar imagens
            e.preventDefault();
            
            let addedCount = 0;
            
            imageItems.forEach(item => {
                if (item.type.indexOf('image') !== -1) {
                    const file = item.getAsFile();
                    if (file && validateImageFile(file)) {
                        handleImageFiles([file]);
                        addedCount++;
                    }
                }
            });
            
            if (addedCount > 0) {
                // Feedback visual
                const zone = document.getElementById('createProductPasteZone');
                zone.classList.add('paste-success');
                setTimeout(() => {
                    zone.classList.remove('paste-success');
                }, 1500);
                
                console.log(`${addedCount} imagem(ns) colada(s) com Ctrl+V`);
            }
        });
    </script>
</body>
</html>
